<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sejin Lee — AI Product Engineer</title>
  <desc id="desc">A dark, minimal banner with a simple AI product workflow.</desc>
  <defs>
    <linearGradient id="background" x1="36" y1="18" x2="1162" y2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="748" y1="0" x2="1090" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" rx="24" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="278" rx="23" stroke="#64748B" stroke-opacity="0.28"/>

  <rect x="64" y="50" width="224" height="34" rx="17" fill="#1E293B" stroke="#67E8F9" stroke-opacity="0.45"/>
  <circle cx="83" cy="67" r="4" fill="#67E8F9"/>
  <text x="98" y="72" fill="#BAE6FD" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">AI PRODUCT ENGINEER</text>

  <text x="62" y="151" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" letter-spacing="-1">Sejin Lee</text>
  <text x="65" y="193" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="20">From intelligent workflows to products people can use.</text>

  <path d="M760 132H1080" stroke="#475569" stroke-width="2"/>
  <path d="M760 132H1080" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.8"/>

  <g fill="#111827" stroke="url(#accent)" stroke-width="3">
    <circle cx="760" cy="132" r="12"/>
    <circle cx="867" cy="132" r="12"/>
    <circle cx="973" cy="132" r="12"/>
    <circle cx="1080" cy="132" r="12"/>
  </g>
  <g fill="url(#accent)">
    <circle cx="760" cy="132" r="4"/>
    <circle cx="867" cy="132" r="4"/>
    <circle cx="973" cy="132" r="4"/>
    <circle cx="1080" cy="132" r="4"/>
  </g>
  <g fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">
    <text x="760" y="169">input</text>
    <text x="867" y="169">retrieve</text>
    <text x="973" y="169">reason</text>
    <text x="1080" y="169">ship</text>
  </g>
</svg>
