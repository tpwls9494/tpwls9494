<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sejin Lee — AI Product Engineer</title>
  <desc id="desc">A dark, minimal banner with a connected-node motif.</desc>
  <defs>
    <linearGradient id="background" x1="36" y1="18" x2="1162" y2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="736" y1="62" x2="1080" y2="226" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="24" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="278" rx="23" stroke="#64748B" stroke-opacity="0.28"/>

  <rect x="64" y="50" width="224" height="34" rx="17" fill="#1E293B" stroke="#67E8F9" stroke-opacity="0.45"/>
  <circle cx="83" cy="67" r="4" fill="#67E8F9"/>
  <text x="98" y="72" fill="#BAE6FD" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">AI PRODUCT ENGINEER</text>

  <text x="62" y="151" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" letter-spacing="-1">Sejin Lee</text>
  <text x="65" y="193" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="20">From intelligent workflows to products people can use.</text>

  <g stroke="url(#accent)" stroke-width="2" stroke-opacity="0.7">
    <path d="M774 78L875 54L972 96L1075 68"/>
    <path d="M774 78L824 160L920 210L972 96"/>
    <path d="M824 160L936 146L1042 198L1075 68"/>
    <path d="M936 146L920 210"/>
    <path d="M972 96L1042 198"/>
  </g>
  <g fill="#0F172A" stroke="url(#accent)" stroke-width="3" filter="url(#glow)">
    <circle cx="774" cy="78" r="8"/>
    <circle cx="875" cy="54" r="6"/>
    <circle cx="972" cy="96" r="11"/>
    <circle cx="1075" cy="68" r="7"/>
    <circle cx="824" cy="160" r="10"/>
    <circle cx="936" cy="146" r="7"/>
    <circle cx="920" cy="210" r="9"/>
    <circle cx="1042" cy="198" r="12"/>
  </g>
  <g fill="#E0F2FE" font-family="Arial, Helvetica, sans-serif" font-size="11" opacity="0.82">
    <text x="755" y="60">input</text>
    <text x="950" y="72">reason</text>
    <text x="796" y="189">retrieve</text>
    <text x="1014" y="228">ship</text>
  </g>
</svg>
